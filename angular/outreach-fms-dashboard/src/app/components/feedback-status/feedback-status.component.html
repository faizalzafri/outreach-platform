<app-header></app-header>
<div style="margin: auto; width: 80%;">
  <div class="input-group mb-4">
    <div class="input-group-prepend">
      <label class="input-group-text" for="inputGroupSelect01">TYPE</label>
    </div>


    <select (change)="selectChangeHandler($event)" class="custom-select" id="inputGroupSelect01">
      <option value="" disabled selected></option>
      <option value="event">Volunteer Attended</option>
      <option value="benificiary">Volunteer Not Attended</option>
      <option value="city">Volunteer Unregistered</option>
    </select>

  </div>

  <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger"
    class="table table-striped table-bordered table-sm row-border hover">
    <thead>
      <tr>
        <th>Event Id</th>
        <th>Employee Id</th>
        <th>Email Status</th>
        <th>Feedback Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let feedback of feedbackReport">
        <td>{{ feedback.eventId }}</td>
        <td>{{ feedback.employeeId }}</td>
        <td>{{ feedback.emailStatus ? 'Sent':'Not Sent'}}</td>
        <td>{{ feedback.feedbackStatus ? 'Recieved' : 'Not Recieved' }}</td>
      </tr>
    </tbody>
  </table>
</div>
<app-footer></app-footer>
