<div class="row">
    <div class="h-100 mt-5 col-md-12 d-flex justify-content-center">
        <p style="font-size: 2em;color: #0074D9"><b>Upload PMO details</b></p>
    </div>
</div>
<div class="h-100 d-flex justify-content-center align-items-center mt-5">
  <div *ngIf="currentFileUpload" class="progress">
    <div class="progress-bar progress-bar-info progress-bar-striped" role="progressbar"
      attr.aria-valuenow="{{progress.percentage}}" aria-valuemin="0" aria-valuemax="100"
      [ngStyle]="{width:progress.percentage+'%'}">
      {{progress.percentage}}%</div>
  </div>

  <label class="btn btn-default">
    <input type="file" (change)="selectFile($event)">
  </label>

  <button class="btn btn-success" [disabled]="!selectedFiles" (click)="upload()">Upload</button>
</div>
