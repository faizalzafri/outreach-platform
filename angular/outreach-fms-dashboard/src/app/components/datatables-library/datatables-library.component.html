<div class="input-group mb-3">
  <div class="input-group-prepend">
    <label class="input-group-text" for="inputGroupSelect01">TYPE</label>
  </div>


  <select (change)="selectChangeHandler($event)" class="custom-select" id="inputGroupSelect01">
    <option value="" disabled selected></option>
    <option value="event">EVENT</option>
    <option value="benificiary">BENIFICIARY</option>
    <option value="city">CITY</option>
  </select>

</div>

<table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-striped table-bordered table-sm row-border hover">
  <thead>
    <tr>
      
      <th>Event Name</th>
      <th>Rating</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let event of eventReport">
      <td>{{ event.name }}</td>
      <td>{{ event.averageScore }}</td>
    </tr>
  </tbody>
</table>
