name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege default: nothing in this workflow needs to write to the repo,
# comment on PRs, or touch packages/deployments.
permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: outreach-platform-parent

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'
          cache-dependency-path: outreach-platform-parent/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # Build-only gate: compiles every module and packages the jars, without
      # running the test suites (unit + Testcontainers-based integration tests
      # run locally via `mvn verify`; this pipeline only needs to confirm it builds).
      - name: Maven build (skip tests)
        run: ./mvnw clean package -B -DskipTests

  # --------------------------------------------------
  # Docker build job - runs only after the backend build passes
  # --------------------------------------------------
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    defaults:
      run:
        working-directory: outreach-platform-parent

    strategy:
      matrix:
        service:
          - discovery-service
          - gateway-service
          - auth-service
          - event-service
          - feedback-service
          - notification-service
          - ingestion-service
          - report-service
          - ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: outreach-platform-parent/pom.xml

      # Build the JAR for the specific service (skip tests - already passed)
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build ${{ matrix.service }} JAR
        run: ./mvnw package -B -pl ${{ matrix.service }} -am -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # Every service's Dockerfile COPYs common-lib/ and sibling service poms relative to
          # outreach-platform-parent/ (multi-module build), so the context has to be the parent
          # directory, not the service's own subdirectory — the previous context caused every
          # image build to fail on "src: not found" the first time this job ever got a chance to
          # run (it was always skipped before, since the job it depended on used to fail earlier
          # in the pipeline on tests/audits, never on the actual build).
          context: outreach-platform-parent
          file: outreach-platform-parent/${{ matrix.service }}/Dockerfile
          push: false
          tags: outreach-platform/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------
  # Frontend build job
  # --------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: outreach-studio

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: outreach-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Build Docker image
        working-directory: .
        run: |
          docker build -t outreach-platform/outreach-studio:${{ github.sha }} -f outreach-studio/Dockerfile outreach-studio/
