name: CI Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: outreach-platform-parent

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 21 (Temurin)
      # --------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'
          cache-dependency-path: outreach-platform-parent/pom.xml

      # --------------------------------------------------
      # 3. Maven verify (compile + test + JaCoCo coverage)
      # --------------------------------------------------
      - name: Maven verify
        run: ./mvnw verify -B -Dmaven.test.failure.ignore=false
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      # --------------------------------------------------
      # 4. SpotBugs static analysis (non-blocking)
      # --------------------------------------------------
      - name: SpotBugs analysis
        run: ./mvnw spotbugs:check -B
        continue-on-error: true

      # --------------------------------------------------
      # 5. PII audit rule
      # Fails the build if log statements reference @PiiField-annotated fields
      # --------------------------------------------------
      - name: PII audit - detect log statements referencing @PiiField fields
        run: |
          #!/bin/bash
          set -euo pipefail

          echo "=== PII Audit: Checking for log statements referencing @PiiField fields ==="

          # Step 1: Find all fields annotated with @PiiField across the codebase
          PII_FIELDS=$(grep -rn "@PiiField" --include="*.java" . \
            | grep -v "public @interface" \
            | grep -v "test/" \
            | grep -v "Test.java" \
            | awk -F: '{print $1":"$2}' || true)

          if [ -z "$PII_FIELDS" ]; then
            echo "No @PiiField annotations found. Skipping audit."
            exit 0
          fi

          # Step 2: Extract field names from @PiiField-annotated lines
          # Look at the line after @PiiField for the field declaration
          FIELD_NAMES=""
          while IFS=: read -r file line_num; do
            if [ -n "$file" ] && [ -n "$line_num" ]; then
              # Search within next 5 lines for the field declaration
              FIELD_NAME=$(sed -n "$((line_num+1)),$((line_num+5))p" "$file" \
                | grep -oP '(?:private|protected|public)?\s+\w+\s+(\w+)\s*[;=]' \
                | head -1 \
                | grep -oP '\w+(?=\s*[;=])' || true)
              if [ -n "$FIELD_NAME" ]; then
                FIELD_NAMES="$FIELD_NAMES $FIELD_NAME"
              fi
            fi
          done <<< "$PII_FIELDS"

          # Deduplicate field names
          FIELD_NAMES=$(echo "$FIELD_NAMES" | tr ' ' '\n' | sort -u | grep -v '^$' || true)

          if [ -z "$FIELD_NAMES" ]; then
            echo "Could not extract field names from @PiiField annotations. Skipping."
            exit 0
          fi

          echo "PII fields detected: $FIELD_NAMES"

          # Step 3: Build a regex pattern for log statement detection
          # Match common SLF4J/Logback log patterns: log.info/debug/warn/error/trace
          LOG_PATTERN="(log|logger|LOG|LOGGER)\.(info|debug|warn|error|trace)\("

          VIOLATIONS_FOUND=0

          for FIELD in $FIELD_NAMES; do
            # Search for log statements that reference PII field names
            # Exclude test files and the PiiField annotation itself
            MATCHES=$(grep -rn -P "$LOG_PATTERN" --include="*.java" . \
              | grep -v "test/" \
              | grep -v "Test.java" \
              | grep -v "@PiiField" \
              | grep -v "PiiField.java" \
              | grep -v "PiiMaskingFilter" \
              | grep -v "SecretMaskingFilter" \
              | grep -w "$FIELD" || true)

            if [ -n "$MATCHES" ]; then
              echo ""
              echo "❌ VIOLATION: Log statements reference PII field '$FIELD':"
              echo "$MATCHES"
              VIOLATIONS_FOUND=$((VIOLATIONS_FOUND + 1))
            fi
          done

          echo ""
          if [ $VIOLATIONS_FOUND -gt 0 ]; then
            echo "❌ PII AUDIT FAILED: Found $VIOLATIONS_FOUND PII field(s) referenced in log statements."
            echo "   Remove PII field references from log statements or use the PII masking filter."
            exit 1
          else
            echo "✅ PII audit passed. No log statements reference @PiiField-annotated fields."
          fi

      # --------------------------------------------------
      # 6. Upload test reports and coverage as artifacts
      # --------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            outreach-platform-parent/**/target/surefire-reports/
            outreach-platform-parent/**/target/failsafe-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: outreach-platform-parent/**/target/site/jacoco/
          retention-days: 7

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: outreach-platform-parent/**/target/spotbugsXml.xml
          retention-days: 7

  # --------------------------------------------------
  # Docker build job - runs only after tests pass
  # --------------------------------------------------
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    defaults:
      run:
        working-directory: outreach-platform-parent

    strategy:
      matrix:
        service:
          - config-server
          - discovery-service
          - gateway-service
          - auth-service
          - event-service
          - feedback-service
          - notification-service
          - ingestion-service
          - report-service
          - ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: outreach-platform-parent/pom.xml

      # Build the JAR for the specific service (skip tests - already passed)
      - name: Build ${{ matrix.service }} JAR
        run: ./mvnw package -B -pl ${{ matrix.service }} -am -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: outreach-platform-parent/${{ matrix.service }}
          push: false
          tags: outreach-platform/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------
  # Frontend build and test job
  # --------------------------------------------------
  frontend-build-and-test:
    name: Frontend - Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: outreach-studio

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: outreach-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run --reporter=junit --outputFile=test-results/junit.xml

      - name: Build production bundle
        run: npm run build

      - name: Build Docker image
        working-directory: .
        run: |
          docker build -t outreach-platform/outreach-studio:${{ github.sha }} -f outreach-studio/Dockerfile outreach-studio/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: outreach-studio/test-results/junit.xml
          retention-days: 7
