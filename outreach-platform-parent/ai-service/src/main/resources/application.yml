spring:
  application:
    name: ai-service

  # Exclude JPA/DataSource/Liquibase — AI Service uses MongoDB only
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration

  # MongoDB (sole data store for AI service)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/outreach_nosql}
      auto-index-creation: true

  # Security: OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8090/oauth2/jwks}

  # Spring AI provider configuration
  ai:
    openai:
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: ${AI_TEMPERATURE:0.7}
          max-tokens: ${AI_MAX_TOKENS:4096}

server:
  port: 9006
  shutdown: graceful

# Eureka service discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Resilience4j — tuned for AI provider calls (higher timeouts)
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state:
          seconds: 60
    instances:
      aiProvider:
        base-config: default
        slow-call-duration-threshold:
          seconds: 30
        slow-call-rate-threshold: 80
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration:
          millis: 1000
    instances:
      aiProvider:
        base-config: default
        max-attempts: 2
        wait-duration:
          millis: 2000
  timelimiter:
    configs:
      default:
        timeout-duration:
          seconds: 30
    instances:
      aiProvider:
        base-config: default
        timeout-duration:
          seconds: 30

# Platform AI properties (custom namespace)
platform:
  ai:
    provider: ${AI_PROVIDER:openai}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    max-tokens: ${AI_MAX_TOKENS:4096}
    temperature: ${AI_TEMPERATURE:0.7}
    job-result-ttl-hours: ${AI_JOB_TTL_HOURS:24}
    features:
      summarize:
        enabled: ${AI_SUMMARIZE_ENABLED:false}
      anomalies:
        enabled: ${AI_ANOMALIES_ENABLED:false}
      query:
        enabled: ${AI_QUERY_ENABLED:false}


# Identity Provider configuration (shared via common-lib)
idp:
  provider: ${IDP_PROVIDER:keycloak}
  jwks-uri: ${IDP_JWKS_URI:http://localhost:8080/realms/outreach/protocol/openid-connect/certs}
