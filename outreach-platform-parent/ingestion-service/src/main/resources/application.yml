spring:
  application:
    name: ingestion-service

  lifecycle:
    timeout-per-shutdown-phase: 15s

  # PostgreSQL datasource
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/outreachfeedbackdb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 3000
      idle-timeout: 600000
      leak-detection-threshold: 30000
      connection-init-sql: SET statement_timeout = '30s'

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Liquibase disabled — schema managed by event-service
  liquibase:
    enabled: false

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # MongoDB
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/outreach_nosql}
      auto-index-creation: true

  # Multipart file upload
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: 9003
  shutdown: graceful

# Eureka client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}

# Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      event-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - feign.FeignException$ServiceUnavailable
          - feign.RetryableException
    instances:
      event-service:
        base-config: default
  ratelimiter:
    configs:
      default:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0s

# OpenFeign
spring.cloud.openfeign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
      event-service:
        connect-timeout: 3000
        read-timeout: 5000

# Ingestion service custom properties
ingestion-service:
  input-directory: ${INGESTION_INPUT_DIR:}
  max-file-size-mb: 25
  allowed-extensions:
    - .xlsx
    - .xls
    - .csv
  max-concurrent-jobs: 5

# SpringDoc OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# JWT configuration
# No issuer-uri here, matching every other service: it would add a JwtIssuerValidator that
# checks the token's iss claim string-equals this value, but auth-service issues tokens with
# iss=http://localhost:8090 (how a browser reaches it for the OAuth2/PKCE flow) while a
# same-service default here would use the internal Docker DNS name — a mismatch that 401s
# every request with "The iss claim is not valid", even though the signature (validated via
# jwk-set-uri below) is genuinely from auth-service.
spring.security.oauth2.resourceserver.jwt:
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/oauth2/jwks}


# Identity Provider configuration (shared via common-lib)
idp:
  provider: ${IDP_PROVIDER:keycloak}
  jwks-uri: ${IDP_JWKS_URI:http://localhost:8080/realms/outreach/protocol/openid-connect/certs}

# Service-to-service auth: client-credentials token for calling event-service via Feign
# (see common-lib's FeignAuthAutoConfiguration). Same client-id/secret registered in
# auth-service's AuthorizationServerConfig.buildServicesClient().
spring.security.oauth2.client:
  registration:
    outreach-services:
      client-id: outreach-services
      client-secret: ${AUTH_SERVICE_CLIENT_SECRET:CHANGE_ME_IN_PRODUCTION}
      authorization-grant-type: client_credentials
  provider:
    outreach-services:
      token-uri: ${AUTH_SERVICE_TOKEN_URI:http://localhost:8090/oauth2/token}
