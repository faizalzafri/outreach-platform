services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: outreach-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: outreachfeedbackdb
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - outreach-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreachfeedbackdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

  mongodb:
    image: mongo:7.0
    container_name: outreach-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: outreach_nosql
    volumes:
      - mongodb-data:/data/db
    networks:
      - outreach-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

  redis:
    image: redis:7-alpine
    container_name: outreach-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_secret
    networks:
      - outreach-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: outreach-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: outreach
      RABBITMQ_DEFAULT_PASS: outreach_secret
    networks:
      - outreach-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 15s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: outreach-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - outreach-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s

  # ─────────────────────────────────────────────────────────────────────────────
  # Platform Infrastructure Services
  # ─────────────────────────────────────────────────────────────────────────────

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: outreach-config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
    networks:
      - outreach-net
    volumes:
      - ./config:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: outreach-discovery
    ports:
      - "8761:8761"
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
    networks:
      - outreach-net
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: outreach-gateway
    ports:
      - "7093:7093"
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redis_secret
      IDP_PROVIDER: keycloak
      IDP_JWKS_URI: http://auth-service:8090/oauth2/jwks
    networks:
      - outreach-net
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7093/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s
    stop_grace_period: 15s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: outreach-auth
    ports:
      - "8090:8090"
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/outreachfeedbackdb
      AUTH_DB_USER: outreach
      AUTH_DB_PASSWORD: outreach_secret
      EUREKA_URI: http://discovery-service:8761/eureka
      IDP_PROVIDER: spring
      IDP_JWKS_URI: http://auth-service:8090/oauth2/jwks
    networks:
      - outreach-net
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s
    stop_grace_period: 15s

  # ─────────────────────────────────────────────────────────────────────────────
  # Business Services
  # ─────────────────────────────────────────────────────────────────────────────

  event-service:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    container_name: outreach-event
    ports:
      - "9004:9004"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/outreachfeedbackdb
      DATABASE_USERNAME: outreach
      DATABASE_PASSWORD: outreach_secret
      MONGODB_URI: mongodb://mongodb:27017/outreach_nosql
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redis_secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: outreach
      RABBITMQ_PASSWORD: outreach_secret
      EUREKA_URI: http://discovery-service:8761/eureka
      JWK_SET_URI: http://auth-service:8090/oauth2/jwks
      IDP_PROVIDER: keycloak
      IDP_JWKS_URI: http://auth-service:8090/oauth2/jwks
    networks:
      - outreach-net
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9004/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s

  feedback-service:
    build:
      context: .
      dockerfile: feedback-service/Dockerfile
    container_name: outreach-feedback
    ports:
      - "9001:9001"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/outreachfeedbackdb
      DATABASE_USERNAME: outreach
      DATABASE_PASSWORD: outreach_secret
      MONGODB_URI: mongodb://mongodb:27017/outreach_nosql
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redis_secret
      EUREKA_URI: http://discovery-service:8761/eureka
      JWKS_URI: http://auth-service:8090/oauth2/jwks
      IDP_PROVIDER: keycloak
      IDP_JWKS_URI: http://auth-service:8090/oauth2/jwks
    networks:
      - outreach-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9001/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: outreach-notification
    ports:
      - "9002:9002"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/outreachfeedbackdb
      DATABASE_USERNAME: outreach
      DATABASE_PASSWORD: outreach_secret
      MONGODB_URI: mongodb://mongodb:27017/outreach_nosql
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: outreach
      RABBITMQ_PASSWORD: outreach_secret
      EUREKA_URI: http://discovery-service:8761/eureka
      JWKS_URI: http://auth-service:8090/oauth2/jwks
      IDP_PROVIDER: keycloak
      IDP_JWKS_URI: http://auth-service:8090/oauth2/jwks
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    networks:
      - outreach-net
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9002/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    container_name: outreach-ingestion
    ports:
      - "9003:9003"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/outreachfeedbackdb
      DATABASE_USERNAME: outreach
      DATABASE_PASSWORD: outreach_secret
      MONGODB_URI: mongodb://mongodb:27017/outreach_nosql
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: outreach
      RABBITMQ_PASSWORD: outreach_secret
      EUREKA_URI: http://discovery-service:8761/eureka
      JWT_JWK_SET_URI: http://auth-service:8090/oauth2/jwks
      JWT_ISSUER_URI: http://auth-service:8090
      IDP_PROVIDER: keycloak
      IDP_JWKS_URI: http://auth-service:8090/oauth2/jwks
      INGESTION_INPUT_DIR: /tmp/ingestion
    networks:
      - outreach-net
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9003/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    container_name: outreach-report
    ports:
      - "9005:9005"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/outreachfeedbackdb
      DATABASE_USERNAME: outreach
      DATABASE_PASSWORD: outreach_secret
      MONGODB_URI: mongodb://mongodb:27017/outreach_nosql
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redis_secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: outreach
      RABBITMQ_PASSWORD: outreach_secret
      EUREKA_URI: http://discovery-service:8761/eureka
      JWK_SET_URI: http://auth-service:8090/oauth2/jwks
      IDP_PROVIDER: keycloak
      IDP_JWKS_URI: http://auth-service:8090/oauth2/jwks
    networks:
      - outreach-net
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9005/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: outreach-ai
    ports:
      - "9006:9006"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/outreach_nosql
      EUREKA_URI: http://discovery-service:8761/eureka
      JWKS_URI: http://auth-service:8090/oauth2/jwks
      IDP_PROVIDER: keycloak
      IDP_JWKS_URI: http://auth-service:8090/oauth2/jwks
      AI_PROVIDER: mock
    networks:
      - outreach-net
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9006/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────

networks:
  outreach-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  postgres-data:
    driver: local
  mongodb-data:
    driver: local
