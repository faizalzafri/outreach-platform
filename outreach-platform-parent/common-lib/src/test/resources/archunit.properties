# ArchUnit configuration for the Outreach Platform
#
# Allow rules to pass when no matching classes are found.
# This is necessary because common-lib doesn't contain service/controller/entity
# classes itself. These rules become effective when inherited by service modules
# where the full classpath includes the target classes.
archRule.failOnEmptyShould = false

# Freeze store for FreezingArchRule (tenant_scoped_repositories_must_not_be_queried_unscoped).
# The path is relative, so each consuming service gets its own archunit_store directory under
# its own module root rather than sharing one global baseline. allowStoreCreation=true lets a
# service create its initial baseline on first run; existing frozen violations are never allowed
# to grow, only shrink, once a baseline exists — see ArchitectureRulesTest's Javadoc.
freeze.store.default.allowStoreCreation = true
