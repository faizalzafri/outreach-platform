# Test application properties for common-lib integration tests
spring.application.name=common-lib-test
spring.main.allow-bean-definition-overriding=true

# Disable security for integration tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# IdP properties required by IdpProperties
idp.provider=spring
idp.jwks-uri=http://localhost:8090/oauth2/jwks
