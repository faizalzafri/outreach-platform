spring:
  # Disable service discovery in tests
  cloud:
    discovery:
      enabled: false

  # Disable security auto-configuration for integration tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  # Use simple in-memory cache for tests (no Redis needed)
  cache:
    type: simple

  # JPA - validate schema created by Liquibase
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Liquibase enabled (Testcontainers provides datasource) - uses test-specific changelog
  liquibase:
    change-log: classpath:db/changelog/db.changelog-test.xml
    enabled: true

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
