spring:
  application:
    name: report-service

  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      read-only: false

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: false

  data:
    mongodb:
      uri: mongodb://localhost:27017/test_outreach

  cache:
    type: simple

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/not-used

  cloud:
    discovery:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

eureka:
  client:
    enabled: false

report-service:
  default-page-size: 20
  max-page-size: 100
  cache-ttl-minutes: 10
  snapshot-retention-days: 365
