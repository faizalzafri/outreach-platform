spring:
  # Disable service discovery in tests
  cloud:
    discovery:
      enabled: false

  # Disable security auto-configuration for migration tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Blank so IdpHealthIndicator (a plain @Component, unaffected by the autoconfig
          # exclusion above) reports UNKNOWN instead of trying to reach a real auth-service and
          # dragging /actuator/health to DOWN — HealthEndpointIT only asserts on db/mongo/redis.
          jwk-set-uri: ""

  # JPA - validate schema created by Liquibase
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Liquibase enabled (Testcontainers provides datasource)
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # MongoDB auto-index creation
  data:
    mongodb:
      auto-index-creation: true

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
