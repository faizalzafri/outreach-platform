# Production profile overrides for gateway-service
spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

# Eureka production settings
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    registry-fetch-interval-seconds: 15
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Production Swagger disabled
springdoc:
  swagger-ui:
    enabled: false

# Logging reduced for production
logging:
  level:
    com.outreach.platform: INFO
    org.springframework: WARN
