# ============================================================================
# Identity Provider Configuration
# ============================================================================
# The gateway validates JWT tokens via the JWKS endpoint regardless of which
# identity provider is active. Set IDP_JWKS_URI or
# idp.jwks-uri to switch between providers without code changes:
#   - Keycloak: http://localhost:8080/realms/outreach/protocol/openid-connect/certs
#   - Spring:   http://localhost:8090/oauth2/jwks
# ============================================================================
idp:
  provider: ${IDP_PROVIDER:keycloak}
  jwks-uri: ${IDP_JWKS_URI:http://localhost:8080/realms/outreach/protocol/openid-connect/certs}

server:
  port: 7093
  shutdown: graceful

spring:
  application:
    name: gateway-service

  lifecycle:
    timeout-per-shutdown-phase: 15s

  # Redis configuration for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # OAuth2 Resource Server - JWT validation via JWKS
  # Uses the idp.jwks-uri property to resolve the correct endpoint for the active provider
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${idp.jwks-uri}

  # Spring Cloud Gateway routes
  cloud:
    gateway:
      default-filters:
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback
      routes:
        - id: feedback-service
          uri: lb://feedback-service
          predicates:
            - Path=/api/feedback/**
          filters:
            - StripPrefix=1

        - id: ingestion-service
          uri: lb://ingestion-service
          predicates:
            - Path=/api/ingestion/**
          filters:
            - StripPrefix=1

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/events/**
          filters:
            - StripPrefix=1

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

        - id: admin-service
          uri: lb://event-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1

# Eureka client configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Resilience4j circuit breaker configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

# Per-tenant rate limiting (token bucket)
tenant:
  rate-limit:
    requests-per-second: ${RATE_LIMIT_RPS:100}

# CORS configurable allowlist
gateway:
  cors:
    allowed-origins:
      - http://localhost:4200
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}

# Caffeine L1 local cache configuration
# Pattern: Caffeine (5s TTL) → Redis (60s TTL) → Database
# Reduces Redis load by ~90% for hot-path reads
cache:
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=5s

# SpringDoc OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
