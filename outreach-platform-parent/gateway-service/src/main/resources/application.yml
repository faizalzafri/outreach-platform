# ============================================================================
# Identity Provider Configuration
# ============================================================================
# The gateway validates JWT tokens via the JWKS endpoint regardless of which
# identity provider is active. Set IDP_JWKS_URI or
# idp.jwks-uri to switch between providers without code changes:
#   - Keycloak: http://localhost:8080/realms/outreach/protocol/openid-connect/certs
#   - Spring:   http://localhost:8090/oauth2/jwks
# ============================================================================
idp:
  provider: ${IDP_PROVIDER:keycloak}
  jwks-uri: ${IDP_JWKS_URI:http://localhost:8080/realms/outreach/protocol/openid-connect/certs}

server:
  port: 7093
  shutdown: graceful

spring:
  application:
    name: gateway-service

  lifecycle:
    timeout-per-shutdown-phase: 15s

  # Redis configuration for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # OAuth2 Resource Server - JWT validation via JWKS
  # Uses the idp.jwks-uri property to resolve the correct endpoint for the active provider
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${idp.jwks-uri}

  # Spring Cloud Gateway routes
  cloud:
    gateway:
      default-filters:
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback
      routes:
        - id: feedback-service
          uri: lb://feedback-service
          predicates:
            - Path=/api/feedback/**
          filters:
            - StripPrefix=1

        - id: ingestion-service
          uri: lb://ingestion-service
          predicates:
            - Path=/api/ingestion/**
          filters:
            - StripPrefix=1

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/events/**
          filters:
            - StripPrefix=1

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

        - id: admin-service
          uri: lb://event-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        - id: volunteer-service
          uri: lb://event-service
          predicates:
            - Path=/api/volunteers/**
          filters:
            - StripPrefix=1

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1

        # Tenant/team/sharing/activity-feed controllers in event-service keep the full
        # /api/... prefix in their own @RequestMapping (unlike every other service's
        # controllers, which expect StripPrefix=1 to have already removed it) — no
        # StripPrefix filter here so the incoming path reaches them unchanged.
        - id: tenant-service
          uri: lb://event-service
          predicates:
            - Path=/api/tenants/**

        - id: team-service
          uri: lb://event-service
          predicates:
            - Path=/api/teams/**

        - id: resource-permission-service
          uri: lb://event-service
          predicates:
            - Path=/api/resources/**

        - id: activity-feed-service
          uri: lb://event-service
          predicates:
            - Path=/api/activity/**

        - id: auth-api-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

# Eureka client configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Resilience4j circuit breaker configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

# Per-tenant rate limiting (token bucket)
tenant:
  rate-limit:
    requests-per-second: ${RATE_LIMIT_RPS:100}

# CORS configurable allowlist
# outreach-studio (the active React frontend) runs on 5173 by default, falling back to 5174+ if
# that port is taken. localhost:4200 was the legacy Angular dashboard's port — that app isn't part
# of this repo's active source tree (see CLAUDE.md) and this allowlist was never updated when it
# was replaced, so every non-GET request from the real frontend was rejected by CORS (GET requests
# went unnoticed because a same-origin browser request only carries an Origin header for
# non-"safe" methods like POST/PUT/DELETE — confirmed via gateway server logs showing
# DefaultCorsProcessor rejecting the Origin on a POST while identical GETs passed through fine).
gateway:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}

# Caffeine L1 local cache configuration
# Pattern: Caffeine (5s TTL) → Redis (60s TTL) → Database
# Reduces Redis load by ~90% for hot-path reads
cache:
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=5s

# SpringDoc OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
