<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — Outreach Studio</title>
    <style>
        /* ─── Reset & Base ─── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ─── Page Layout ─── */
        .page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 1.5rem;
            background:
                radial-gradient(ellipse at top left, rgba(79, 70, 229, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(79, 70, 229, 0.05) 0%, transparent 50%),
                #f8fafc;
        }

        /* ─── Card ─── */
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 3rem 2.5rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        /* ─── Brand ─── */
        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .brand-icon {
            font-size: 1.75rem;
            color: #4f46e5;
            line-height: 1;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0f172a;
            letter-spacing: -0.01em;
        }

        /* ─── Heading & Subtitle ─── */
        .heading {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 0.5rem;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #475569;
            margin: 0 0 2rem;
            text-align: center;
            line-height: 1.5;
        }

        /* ─── Alert Messages ─── */
        .alert {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        /* ─── Form ─── */
        .form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .field label {
            font-size: 0.825rem;
            font-weight: 500;
            color: #0f172a;
        }

        .field input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 0.9rem;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .field input::placeholder {
            color: #94a3b8;
        }

        .field input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }

        /* ─── Button ─── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.5rem;
            margin-top: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #ffffff;
            background: #4f46e5;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            background: #4338ca;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:focus-visible {
            outline: 2px solid #818cf8;
            outline-offset: 2px;
        }

        /* ─── Footer ─── */
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }

        /* ─── Responsive ─── */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }

            .heading {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <!-- Brand -->
        <div class="brand">
            <span class="brand-icon" aria-hidden="true">◈</span>
            <span class="brand-name">Outreach Studio</span>
        </div>

        <!-- Heading -->
        <h1 class="heading">Welcome back</h1>
        <p class="subtitle">Enter your credentials to continue</p>

        <!-- Error Message -->
        <div th:if="${param.error}" class="alert alert-error" role="alert">
            Invalid username or password. Please try again.
        </div>

        <!-- Logout Success Message -->
        <div th:if="${param.logout}" class="alert alert-success" role="status">
            You have been signed out successfully.
        </div>

        <!-- Login Form -->
        <form class="form" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required
                       autofocus/>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required/>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <!-- Footer -->
        <p class="footer">Secured with OAuth 2.0 + PKCE</p>
    </div>
</div>
</body>
</html>
