<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forgot password')}"></head>
<body>
<div class="page">
    <div class="card">
        <div th:replace="~{fragments :: brand}"></div>

        <th:block th:unless="${sent}">
            <h1 class="heading">Forgot your password?</h1>
            <p class="subtitle">Enter your username or email address and we'll email you a link to choose a new one.</p>

            <form class="form" th:action="@{/forgot-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="field">
                    <label for="identifier">Username or email</label>
                    <input type="text" id="identifier" name="identifier" autocomplete="username" required autofocus/>
                </div>
                <button type="submit" class="btn-primary">Send reset link</button>
            </form>
        </th:block>

        <th:block th:if="${sent}">
            <h1 class="heading">Check your email</h1>
            <p class="subtitle">
                If an active account matches what you entered, we've sent it a password reset link.
                The link expires in <span th:text="${resetMinutes}">30</span> minutes.
            </p>
        </th:block>

        <a class="link back-link" th:href="@{/login}">Back to sign in</a>
    </div>
</div>
</body>
</html>
