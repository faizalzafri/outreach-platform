<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Verify your sign-in')}"></head>
<body>
<div class="page">
    <div class="card">
        <div th:replace="~{fragments :: brand}"></div>

        <h1 class="heading">Check your email</h1>
        <p class="subtitle">
            We sent a verification code to <strong th:text="${destination}">p•••@example.com</strong>.
            Enter it to finish signing in.
        </p>

        <div th:if="${error}" class="alert alert-error" role="alert" th:text="${error}">That code isn't right.</div>
        <div th:if="${notice}" class="alert alert-success" role="status" th:text="${notice}">We sent you a new code.</div>

        <form class="form" th:action="@{/login/otp}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="field">
                <label for="code">Verification code</label>
                <input type="text" id="code" name="code" class="code" inputmode="numeric" pattern="[0-9 ]*"
                       autocomplete="one-time-code" maxlength="10" required autofocus/>
            </div>
            <button type="submit" class="btn-primary">Verify</button>
        </form>

        <form class="form" th:action="@{/login/otp/resend}" method="post" style="margin-top: 0.75rem">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-secondary">Send a new code</button>
        </form>

        <a class="link back-link" th:href="@{/login}">Use a different account</a>
    </div>
</div>
</body>
</html>
