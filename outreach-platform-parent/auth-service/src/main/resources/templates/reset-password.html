<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reset your password')}"></head>
<body>
<div class="page">
    <div class="card">
        <div th:replace="~{fragments :: brand}"></div>

        <h1 class="heading">Choose a new password</h1>
        <p class="subtitle">
            For <strong th:text="${username}">priya</strong>. This link works once.
        </p>

        <div th:replace="~{fragments :: violations(${violations})}"></div>

        <form class="form" th:action="@{/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="token" th:value="${token}"/>
            <th:block th:replace="~{fragments :: password-fields}"></th:block>
            <div class="field" th:if="${otpRequired}">
                <label for="otpCode">Verification code</label>
                <input type="text" id="otpCode" name="otpCode" class="code" inputmode="numeric" pattern="[0-9 ]*"
                       autocomplete="one-time-code" maxlength="10" required aria-describedby="otp-hint"/>
                <p id="otp-hint" class="hint">Your organization also asks for the code we just emailed you.</p>
            </div>
            <button type="submit" class="btn-primary">Change password</button>
        </form>
    </div>
</div>
</body>
</html>
