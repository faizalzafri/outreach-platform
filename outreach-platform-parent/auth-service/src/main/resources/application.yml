# ============================================================================
# Identity Provider Configuration
# ============================================================================
# The idp.provider property controls which identity provider is active:
#   - "spring"   -> Activates the embedded Spring Authorization Server (this service)
#   - "keycloak" -> Deactivates auth server beans; Keycloak container handles tokens
#
# Switching providers requires NO code changes — only this configuration value
# and the corresponding idp.jwks-uri need to change.
# Resource servers always validate tokens via JWKS.
# ============================================================================
idp:
  provider: ${IDP_PROVIDER:spring}
  jwks-uri: ${IDP_JWKS_URI:http://localhost:8090/oauth2/jwks}

server:
  port: 8090
  shutdown: graceful

spring:
  application:
    name: auth-service

  lifecycle:
    timeout-per-shutdown-phase: 15s

  # PostgreSQL datasource
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/outreachfeedbackdb}
    username: ${AUTH_DB_USER:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 3000
      idle-timeout: 600000
      leak-detection-threshold: 30000
      connection-init-sql: SET statement_timeout = '30s'

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Liquibase schema management
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Identity events (invitations, password resets, OTP) go out through the outbox to RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Authorization Server configuration (type-safe properties)
auth-server:
  issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8090}
  public-url: ${AUTH_PUBLIC_URL:http://localhost:8090}
  accounts:
    activation-ttl: 72h
    password-reset-ttl: 30m
  bootstrap:
    platform-admin-email: ${PLATFORM_ADMIN_EMAIL:}
    platform-admin-username: ${PLATFORM_ADMIN_USERNAME:platform_admin}
  clients:
    dashboard:
      client-id: outreach-dashboard
      redirect-uri: http://localhost:5173/callback
      # Hidden-iframe session renewal target (the SPA's public/silent-callback.html)
      silent-redirect-uri: http://localhost:5173/silent-callback.html
      post-logout-redirect-uri: http://localhost:5173/login
    services:
      client-id: outreach-services
      client-secret: ${AUTH_SERVICE_CLIENT_SECRET:CHANGE_ME_IN_PRODUCTION}
  token:
    access-token-time-to-live: 5m
    refresh-token-time-to-live: 30m
    refresh-token-max-reuse: 0
  security:
    password-policy:
      min-length: 12
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special-char: true
      history-count: 5
      reject-common-passwords: true
    brute-force:
      max-failed-attempts: 5
      lock-duration: 30m
    # Platform defaults; each tenant admin can turn these on and tune them for their organization
    otp:
      purposes:
        LOGIN: { enabled: false, length: 6, ttl: 5m, max-attempts: 5, resend-cooldown: 30s }
        PASSWORD_RESET: { enabled: false, length: 6, ttl: 10m, max-attempts: 5, resend-cooldown: 30s }
        PASSWORD_CHANGE: { enabled: false, length: 6, ttl: 5m, max-attempts: 5, resend-cooldown: 30s }

# Eureka client registration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://eurekaadmin:eurekasecret@localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}

# Tenant migration configuration
tenant:
  grace-period-days: 30
  migration-start-date: ${TENANT_MIGRATION_START_DATE:2025-01-20}

# Logging
logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG
    com.outreach.platform.auth: DEBUG
