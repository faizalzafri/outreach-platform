server:
  port: 8090

spring:
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}

# Production token settings (override defaults)
auth-server:
  issuer-uri: ${AUTH_ISSUER_URI}
  clients:
    services:
      client-secret: ${AUTH_SERVICE_CLIENT_SECRET}

# Eureka production settings
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    registry-fetch-interval-seconds: 15
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Logging reduced for production
logging:
  level:
    org.springframework.security.oauth2: INFO
    com.outreach.platform.auth: INFO
    org.springframework: WARN
