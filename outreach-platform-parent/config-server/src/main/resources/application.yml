server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        # Native filesystem backend (default for local development)
        native:
          search-locations: ${CONFIG_REPO_PATH:file:./config}

  # Basic security for config server endpoints
  security:
    user:
      name: ${CONFIG_SERVER_USER:configadmin}
      password: ${CONFIG_SERVER_PASSWORD:configsecret}

# Symmetric encryption key for {cipher} values in config files
encrypt:
  key: ${ENCRYPT_KEY:dev-encrypt-key-change-in-production}

# Eureka client registration (disabled by default for standalone testing)
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Actuator endpoints for health and refresh
management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh, env, encrypt, decrypt
  endpoint:
    health:
      show-details: when-authorized

# Logging configuration
logging:
  level:
    org.springframework.cloud.config: INFO
    org.springframework.security: WARN

---
# Git-backed profile for production deployments
spring:
  config:
    activate:
      on-profile: git

  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/org/config-repo.git}
          default-label: ${CONFIG_GIT_BRANCH:main}
          clone-on-start: true
          force-pull: true
          search-paths: '{application}'
