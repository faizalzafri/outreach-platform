# Shared defaults for all microservices
# This file is served to all applications regardless of profile

spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Platform-wide AI settings namespace
platform:
  ai:
    provider: ${AI_PROVIDER:openai}
    enabled: false
    features:
      sentiment-analysis: false
      auto-categorization: false
      response-suggestion: false
    defaults:
      temperature: 0.7
      max-tokens: 2048
      top-p: 1.0

# Default actuator exposure for all services
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, refresh
  endpoint:
    health:
      show-details: when-authorized

# Eureka client defaults
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Resilience4j defaults
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
