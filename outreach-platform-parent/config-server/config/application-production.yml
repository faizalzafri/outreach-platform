# Production profile - hardened settings with encrypted secrets
# All sensitive values use {cipher} prefix for Spring Cloud Config encryption

spring:
  datasource:
    url: jdbc:postgresql://prod-db.internal:5432/outreachfeedbackdb
    username: '{cipher}prod-db-username-encrypted'
    password: '{cipher}prod-db-password-encrypted'
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    mongodb:
      uri: '{cipher}prod-mongodb-uri-encrypted'
  redis:
    host: prod-redis.internal
    port: 6379
    password: '{cipher}prod-redis-password-encrypted'
    ssl:
      enabled: true

# AI settings for production - conservative limits
platform:
  ai:
    enabled: true
    provider: openai
    api-key: '{cipher}prod-ai-api-key-encrypted'
    features:
      sentiment-analysis: true
      auto-categorization: true
      response-suggestion: true
    defaults:
      temperature: 0.3
      max-tokens: 2048
      top-p: 0.9
    rate-limit:
      requests-per-minute: 60
      tokens-per-minute: 100000

# Production logging - minimal, structured JSON
logging:
  level:
    com.outreach.platform: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: '{"timestamp":"%d","level":"%p","service":"%X{service}","trace":"%X{traceId}","span":"%X{spanId}","message":"%m"}%n'

# SpringDoc - disable Swagger UI in production, keep /v3/api-docs available for tooling
springdoc:
  swagger-ui:
    enabled: false

# SMTP settings for production
platform.notification:
  smtp:
    host: '{cipher}prod-smtp-host-encrypted'
    port: 587
    username: '{cipher}prod-smtp-username-encrypted'
    password: '{cipher}prod-smtp-password-encrypted'
    starttls: true

# Eureka for production cluster
eureka:
  client:
    service-url:
      defaultZone: '{cipher}prod-eureka-url-encrypted'
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
