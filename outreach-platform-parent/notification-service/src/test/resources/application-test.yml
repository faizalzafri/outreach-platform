spring:
  application:
    name: notification-service

  # Exclude OAuth2 Resource Server and Mail Health auto-configuration in tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration

  # Use H2 for tests (avoid requiring PostgreSQL)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # Disable Liquibase in tests
  liquibase:
    enabled: false

  # Embedded MongoDB or disable for unit tests
  data:
    mongodb:
      uri: mongodb://localhost:27017/test_notifications
      auto-index-creation: false

  # Mail - no real SMTP in tests
  mail:
    host: localhost
    port: 3025

  # Disable Thymeleaf caching in tests
  thymeleaf:
    cache: false

server:
  port: 0

# Disable security for integration tests
app:
  security:
    enabled: false

# Disable Eureka in tests
eureka:
  client:
    enabled: false

# Notification service test properties
notification-service:
  max-retry-attempts: 3
  retry-backoff-minutes: 1,5,30
  from-address: test@outreach.com
  from-name: Test Platform
  batch-size: 10
