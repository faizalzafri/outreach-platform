spring:
  application:
    name: notification-service

  lifecycle:
    timeout-per-shutdown-phase: 15s

  # PostgreSQL datasource
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/outreachfeedbackdb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 3000
      idle-timeout: 600000
      leak-detection-threshold: 30000
      connection-init-sql: SET statement_timeout = '30s'

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Liquibase configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # MongoDB
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/outreach_nosql}
      auto-index-creation: false

  # Spring Mail SMTP configuration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          # Real SMTP providers need both; MailHog (the dev/docker-compose target) supports
          # neither and rejects them outright — jakarta.mail refuses to even connect with
          # auth=true and no password configured ("AuthenticationFailedException: failed to
          # connect, no password specified?"), confirmed live against the running dev stack.
          auth: ${SMTP_AUTH_ENABLED:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:true}
          connectiontimeout: 5000
          timeout: 5000

  # Thymeleaf template engine (for email templates)
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true

  # Security: OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8090/oauth2/jwks}

  # OpenFeign defaults
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
          event-service:
            connect-timeout: 3000
            read-timeout: 5000
          feedback-service:
            connect-timeout: 3000
            read-timeout: 5000

server:
  port: 9002
  shutdown: graceful

# Eureka client registration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}

# Resilience4j configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      event-service:
        base-config: default
      feedback-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
    instances:
      event-service:
        base-config: default
      feedback-service:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

# Notification service custom properties
notification-service:
  max-retry-attempts: 5
  retry-backoff-minutes: 1,5,30,120,720
  from-address: noreply@outreach.com
  from-name: Outreach Platform
  batch-size: 50

# SpringDoc OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method


# Identity Provider configuration (shared via common-lib)
idp:
  provider: ${IDP_PROVIDER:keycloak}
  jwks-uri: ${IDP_JWKS_URI:http://localhost:8080/realms/outreach/protocol/openid-connect/certs}

# Service-to-service auth for calling event-service via Feign: common-lib's
# FeignAuthAutoConfiguration is available whenever this service actually needs a
# client-credentials-authenticated Feign call. Not wired up here yet — its EventServiceClient
# has no real call sites in production code, same as ingestion-service's had until this session
# — and enabling it turned out to have a real side effect: the mere presence of
# spring.security.oauth2.client.registration.* properties changes @WebMvcTest slices' default
# security behavior (unauthenticated requests 302-redirect to a login page instead of 401),
# which broke report-service's ReportControllerTest. Add this registration back (mirroring
# ingestion-service's application.yml) only once there's a real caller here, and account for
# that test-slice effect when you do.
